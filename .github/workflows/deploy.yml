# .github/workflows/deploy.yml
name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Mundëson deploy manual

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME_BACKEND: ${{ github.repository }}/backend
  IMAGE_NAME_FRONTEND: ${{ github.repository }}/frontend

jobs:
  # ==========================================
  # JOB 1: TESTE DHE KONTROLLA
  # ==========================================
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: ./${{ matrix.service }}
        run: npm ci

      - name: Run linting
        working-directory: ./${{ matrix.service }}
        run: npm run lint || true

      - name: Run unit tests
        working-directory: ./${{ matrix.service }}
        run: npm run test

      - name: Run build
        working-directory: ./${{ matrix.service }}
        run: npm run build

  # ==========================================
  # JOB 2: BUILD DHE PUSH I IMAGE-VE
  # ==========================================
  build-and-push:
    needs: test-and-validate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:latest
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate deployment manifest
        run: |
          cat > deploy-manifest.json << EOF
          {
            "backend_image": "${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:${{ github.sha }}",
            "frontend_image": "${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME_FRONTEND }}:${{ github.sha }}",
            "commit_sha": "${{ github.sha }}",
            "deploy_time": "$(date -Iseconds)"
          }
          EOF

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: deploy-manifest
          path: deploy-manifest.json

  # ==========================================
  # JOB 3: DEPLOY NË SERVER
  # ==========================================
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
      - name: Download deployment manifest
        uses: actions/download-artifact@v4
        with:
          name: deploy-manifest
          path: .

      - name: Read manifest
        id: manifest
        run: |
          BACKEND_IMAGE=$(jq -r '.backend_image' deploy-manifest.json)
          FRONTEND_IMAGE=$(jq -r '.frontend_image' deploy-manifest.json)
          echo "backend_image=$BACKEND_IMAGE" >> $GITHUB_OUTPUT
          echo "frontend_image=$FRONTEND_IMAGE" >> $GITHUB_OUTPUT

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add known host
        run: |
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to production server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'ENDSSH'
            # Ndrysho në direktorinë e projektit
            cd /app/container-management-system
            
            # Tërhiq ndryshimet nga repo
            git pull origin main
            
            # Krijo .env.production nga GitHub Secrets
            cat > .env.production << EOF
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRES_IN=7d
            FRONTEND_URLS=${{ secrets.FRONTEND_URLS }}
            REACT_APP_API_URL=${{ secrets.REACT_APP_API_URL }}
            EOF
            
            # Tërhiq imazhet e reja
            docker pull ${{ steps.manifest.outputs.backend_image }}
            docker pull ${{ steps.manifest.outputs.frontend_image }}
            
            # Stop dhe remove containers të vjetra
            docker-compose -f docker-compose.prod.yml down
            
            # Start containers e reja
            docker-compose -f docker-compose.prod.yml up -d
            
            # Clean up images të vjetra
            docker system prune -f --filter "until=24h"
            
            # Kontrollo nëse të gjithë container-at po punojnë
            sleep 10
            docker-compose -f docker-compose.prod.yml ps
          ENDSSH

      - name: Health check verification
        run: |
          sleep 30
          curl -f https://${{ secrets.DOMAIN_NAME }}/health || exit 1
          echo "✅ Deployment successful!"

  # ==========================================
  # JOB 4: NOTIFIKIME (Opsionale)
  # ==========================================
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Send deployment notification
        run: |
          STATUS="${{ needs.deploy.result }}"
          if [ "$STATUS" == "success" ]; then
            echo "✅ Deployment successful!"
            # Shto notifikime këtu (Slack, Email, Discord, etj.)
          else
            echo "❌ Deployment failed!"
            exit 1
          fi