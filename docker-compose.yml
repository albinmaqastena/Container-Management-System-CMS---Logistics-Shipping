# docker-compose.prod.yml
#
# Ky file përdoret vetëm për VPS / self-hosted Docker deployment.
#
# Railway deployment nuk përdor docker-compose.
# Në Railway përdoren services individuale:
# - frontend
# - backend
# - PostgreSQL
# - Redis
#
# Storage i file-ve përdor S3-compatible storage.
# Cloudflare përdoret për DNS/security.

# docker-compose.prod.yml
version: '3.8'

services:
  # ==========================================
  # POSTGRESQL DATABASE
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: container_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # REDIS CACHE
  # ==========================================
  redis:
    image: redis:7-alpine

    container_name:
      container_redis_prod

    restart: unless-stopped

    environment:
      REDIS_PASSWORD:
        ${REDIS_PASSWORD}

    command:
      redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes

    volumes:
      - redis_data:/data

    networks:
      - app-network

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # BACKEND (NestJS)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: container_backend_prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      FRONTEND_URLS: ${FRONTEND_URLS}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ==========================================
  # FRONTEND (React)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
       React_APP_API_URL:
         ${REACT_APP_API_URL}

    container_name:
      container_frontend_prod

    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - app-network

  # ==========================================
  # NGINX (Reverse Proxy - Opsionale)
  # ==========================================
  # Nëse dëshiron një reverse proxy për të 
  # trajtuar SSL dhe multiple services
  nginx:
    image: nginx:alpine
    container_name: container_nginx_prod
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local